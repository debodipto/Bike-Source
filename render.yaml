databases:
  - name: bike-source-db
    plan: free
    databaseName: bike_source
    user: bike_source_user

services:
  - type: web
    name: bike-source
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn core.asgi:application -k uvicorn.workers.UvicornWorker
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bike-source-db
          property: connectionString
      - key: DEBUG
        value: false
      - key: WEB_CONCURRENCY
        value: 4
