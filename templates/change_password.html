{% extends 'base.html' %}
{% block title %}Change Password | Bike Source{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <p class="eyebrow">Security</p>
    <h1>Change your password.</h1>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {% for field in form %}
        <div class="field-wide">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="helper-text" style="color: var(--danger);">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <div class="field-wide">
        <button type="submit">Update password</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
